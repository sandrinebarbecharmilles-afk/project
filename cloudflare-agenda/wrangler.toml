name = "agenda-famille"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

# --- Base de données D1 ---
# Remplacez database_id par l'identifiant renvoyé par :  wrangler d1 create agenda
[[d1_databases]]
binding = "DB"
database_name = "agenda"
database_id = "REMPLACER_PAR_VOTRE_DATABASE_ID"

# --- Variables publiques ---
# L'ID client Google peut aussi être défini dans le tableau de bord Cloudflare
# (Pages > Settings > Variables). Le secret SESSION_SECRET, lui, NE doit PAS
# figurer ici : utilisez « wrangler pages secret put SESSION_SECRET ».
[vars]
GOOGLE_CLIENT_ID = "REMPLACER_PAR_VOTRE_CLIENT_ID.apps.googleusercontent.com"
