<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Connexion — Bibliothèque École</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding-bottom: 0;
    }

    .login-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 32px;
      max-width: 380px;
      width: 90%;
      text-align: center;
    }

    .login-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: var(--light);
      margin-bottom: 36px;
    }

    .login-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      display: block;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 13px 20px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--dark);
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      box-shadow: 0 2px 8px rgba(44,24,16,0.07);
    }

    .btn-google:hover {
      border-color: var(--accent);
      background: rgba(59,110,138,0.03);
      box-shadow: 0 4px 16px rgba(59,110,138,0.15);
    }

    .btn-google svg {
      flex-shrink: 0;
    }

    .login-error {
      margin-top: 18px;
      padding: 12px 16px;
      background: rgba(178,34,34,0.07);
      border: 1px solid rgba(178,34,34,0.2);
      border-radius: 10px;
      font-size: 0.84rem;
      color: #B22222;
      display: none;
    }

    .login-loading {
      margin-top: 18px;
      font-size: 0.84rem;
      color: var(--light);
      display: none;
    }

    .brand-link {
      margin-top: 32px;
      font-size: 0.75rem;
      color: var(--light);
      text-decoration: none;
    }
    .brand-link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="login-card">
    <span class="login-icon">📚</span>
    <div class="login-logo">Bibliothèque École</div>
    <div class="login-subtitle">SG Créations — Gestion des prêts</div>

    <button id="btn-google-login" class="btn-google" onclick="signInWithGoogle()">
      <!-- Google G logo SVG -->
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="none" d="M0 0h48v48H0z"/>
      </svg>
      Se connecter avec Google
    </button>

    <div id="login-error" class="login-error"></div>
    <div id="login-loading" class="login-loading">Connexion en cours…</div>
  </div>

  <a href="../index.html" class="brand-link">← SG Créations</a>

  <script>
    // Init Firebase
    firebase.initializeApp(FIREBASE_CONFIG)
    const auth = firebase.auth()
    const db   = firebase.firestore()

    // If already logged-in, redirect immediately
    auth.onAuthStateChanged(async function(user) {
      if (!user) return
      // Check authorization
      const allowed = await isAuthorized(user.email)
      if (allowed) {
        window.location.href = 'index.html'
      }
      // If not authorized, stay on login (they'll see the error after clicking)
    })

    async function isAuthorized(email) {
      if (!email) return false
      if (email === ADMIN_EMAIL) return true
      try {
        const snap = await db.collection('authorized_users').doc(email).get()
        return snap.exists
      } catch { return false }
    }

    function signInWithGoogle() {
      const errorEl   = document.getElementById('login-error')
      const loadingEl = document.getElementById('login-loading')
      const btnEl     = document.getElementById('btn-google-login')

      errorEl.style.display   = 'none'
      loadingEl.style.display = 'block'
      btnEl.disabled = true

      const provider = new firebase.auth.GoogleAuthProvider()

      auth.signInWithPopup(provider)
        .then(async function(result) {
          const email = result.user.email
          const allowed = await isAuthorized(email)
          if (!allowed) {
            // Sign out immediately
            await auth.signOut()
            loadingEl.style.display = 'none'
            btnEl.disabled = false
            errorEl.textContent = 'Accès non autorisé. Contactez l\'administratrice pour obtenir un accès.'
            errorEl.style.display = 'block'
          } else {
            window.location.href = 'index.html'
          }
        })
        .catch(function(err) {
          loadingEl.style.display = 'none'
          btnEl.disabled = false
          if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
            // User closed popup — no error message
          } else {
            errorEl.textContent = 'Erreur de connexion : ' + err.message
            errorEl.style.display = 'block'
          }
        })
    }
  </script>
</body>
</html>
