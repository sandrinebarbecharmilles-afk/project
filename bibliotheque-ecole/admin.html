<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Administration — Bibliothèque École</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Admin-specific styles */
    .admin-nav {
      display: flex;
      gap: 0;
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      margin-bottom: 28px;
    }

    .admin-tab {
      padding: 14px 24px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--light);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      margin-bottom: -2px;
    }
    .admin-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .admin-tab:hover { color: var(--dark); }

    .admin-section { display: none; }
    .admin-section.active { display: block; }

    /* Users table */
    .users-table-wrap {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 28px;
    }

    .users-table {
      width: 100%;
      border-collapse: collapse;
    }

    .users-table th {
      background: rgba(59,110,138,0.07);
      padding: 11px 16px;
      text-align: left;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--mid);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }

    .users-table td {
      padding: 12px 16px;
      font-size: 0.87rem;
      color: var(--dark);
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .users-table tr:last-child td { border-bottom: none; }
    .users-table tbody tr:hover { background: rgba(59,110,138,0.025); }

    .user-email {
      font-size: 0.82rem;
      color: var(--mid);
    }

    .role-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 50px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .role-badge.admin {
      background: rgba(59,110,138,0.12);
      color: var(--accent);
    }
    .role-badge.user {
      background: rgba(155,117,96,0.1);
      color: var(--warm);
    }

    /* Add user form */
    .add-user-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
    }

    .add-user-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 18px;
    }

    .add-user-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .add-user-row .text-input { flex: 1; min-width: 160px; }

    /* Overview stats */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px 20px;
      text-align: center;
    }

    .stat-card-value {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 600;
      color: var(--dark);
      line-height: 1;
      margin-bottom: 6px;
    }
    .stat-card-value.overdue { color: #B5635A; }

    .stat-card-label {
      font-size: 0.79rem;
      color: var(--light);
      font-weight: 500;
    }

    .empty-users {
      text-align: center;
      padding: 32px 20px;
      color: var(--light);
      font-size: 0.88rem;
      font-style: italic;
    }

    .date-cell {
      font-size: 0.78rem;
      color: var(--light);
    }

    @media (max-width: 600px) {
      .users-table .hide-mobile { display: none; }
      .admin-tab { padding: 12px 14px; font-size: 0.82rem; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="index.html" class="back-link">← Bibliothèque</a>
    <h1>Administration</h1>
    <button class="btn-add-quick" style="background:rgba(178,34,34,0.2);color:#ffb3aa;" onclick="doSignOut()" title="Se déconnecter" aria-label="Se déconnecter">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </header>

  <!-- Auth gate — hidden until auth resolves -->
  <div id="auth-loading" style="text-align:center;padding:80px 20px;">
    <div class="spinner" role="status" aria-label="Chargement"></div>
    <p style="color:var(--light);margin-top:12px;font-size:0.88rem;">Vérification de l'accès…</p>
  </div>

  <div id="admin-content" hidden>
    <div class="app-main">

      <nav class="admin-nav">
        <button class="admin-tab active" data-section="users" onclick="switchAdminTab('users')">Utilisateurs</button>
        <button class="admin-tab" data-section="overview" onclick="switchAdminTab('overview')">Vue d'ensemble</button>
      </nav>

      <!-- ===== USERS TAB ===== -->
      <section id="section-users" class="admin-section active">
        <div class="users-table-wrap">
          <table class="users-table" aria-label="Utilisateurs autorisés">
            <thead>
              <tr>
                <th>Nom</th>
                <th>Email</th>
                <th class="hide-mobile">Rôle</th>
                <th class="hide-mobile">Ajouté le</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="users-tbody">
              <tr><td colspan="5" class="empty-users">Chargement…</td></tr>
            </tbody>
          </table>
        </div>

        <div class="add-user-card">
          <h3>Ajouter un utilisateur</h3>
          <div class="add-user-row">
            <input type="text" id="new-user-name" class="text-input" placeholder="Prénom Nom" autocomplete="off">
            <input type="email" id="new-user-email" class="text-input" placeholder="email@example.com" autocomplete="off">
            <button class="btn-primary" onclick="addUser()">Ajouter</button>
          </div>
        </div>
      </section>

      <!-- ===== OVERVIEW TAB ===== -->
      <section id="section-overview" class="admin-section">
        <div id="overview-grid" class="overview-grid">
          <div class="stat-card">
            <div class="stat-card-value" id="stat-books">—</div>
            <div class="stat-card-label">Livres au catalogue</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-value" id="stat-students">—</div>
            <div class="stat-card-label">Élèves enregistrés</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-value" id="stat-loans">—</div>
            <div class="stat-card-label">Prêts actifs</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-value overdue" id="stat-overdue">—</div>
            <div class="stat-card-label">Prêts en retard</div>
          </div>
        </div>
      </section>

    </div>
  </div>

  <div id="toast" class="toast" aria-live="assertive" hidden></div>

  <script>
    'use strict'

    firebase.initializeApp(FIREBASE_CONFIG)
    const auth = firebase.auth()
    const db   = firebase.firestore()

    /* ---- auth guard ---- */
    auth.onAuthStateChanged(function(user) {
      if (!user) {
        window.location.href = 'login.html'
        return
      }
      if (user.email !== ADMIN_EMAIL) {
        document.getElementById('auth-loading').innerHTML =
          '<div style="text-align:center;padding:60px 20px;">' +
          '<p style="font-size:1.1rem;font-weight:600;color:var(--dark)">Accès non autorisé</p>' +
          '<p style="color:var(--light);margin-top:8px;font-size:0.88rem">Cette page est réservée à l\'administratrice.</p>' +
          '<button class="btn-secondary" style="margin-top:20px" onclick="doSignOut()">Se déconnecter</button>' +
          '</div>'
        return
      }
      document.getElementById('auth-loading').hidden = true
      document.getElementById('admin-content').hidden = false
      loadUsers()
      loadOverview()
    })

    function doSignOut() {
      auth.signOut().then(function() { window.location.href = 'login.html' })
    }

    /* ---- tab switching ---- */
    function switchAdminTab(name) {
      document.querySelectorAll('.admin-tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.section === name)
      })
      document.querySelectorAll('.admin-section').forEach(function(s) {
        s.classList.toggle('active', s.id === 'section-' + name)
      })
    }

    /* ---- Users ---- */
    function loadUsers() {
      const tbody = document.getElementById('users-tbody')

      // Admin row (always shown first)
      let html = '<tr>' +
        '<td><strong>Sandrine Georges</strong></td>' +
        '<td class="user-email">' + escHtml(ADMIN_EMAIL) + '</td>' +
        '<td class="hide-mobile"><span class="role-badge admin">Admin</span></td>' +
        '<td class="hide-mobile date-cell">—</td>' +
        '<td></td>' +
        '</tr>'
      tbody.innerHTML = html

      db.collection('authorized_users').orderBy('addedDate', 'asc').get()
        .then(function(snap) {
          if (snap.empty) {
            tbody.innerHTML = html + '<tr><td colspan="5" class="empty-users">Aucun utilisateur supplémentaire</td></tr>'
            return
          }
          const rows = []
          snap.forEach(function(doc) {
            const u = doc.data()
            rows.push(
              '<tr>' +
              '<td>' + escHtml(u.name || '') + '</td>' +
              '<td class="user-email">' + escHtml(doc.id) + '</td>' +
              '<td class="hide-mobile"><span class="role-badge user">' + escHtml(u.role || 'user') + '</span></td>' +
              '<td class="hide-mobile date-cell">' + formatDate(u.addedDate) + '</td>' +
              '<td><button class="btn-danger" style="padding:6px 14px;font-size:0.76rem;width:auto" ' +
              'onclick="deleteUser(' + JSON.stringify(doc.id) + ')">Supprimer</button></td>' +
              '</tr>'
            )
          })
          tbody.innerHTML = html + rows.join('')
        })
        .catch(function(err) {
          tbody.innerHTML = html + '<tr><td colspan="5" class="empty-users" style="color:#B22222">Erreur : ' + escHtml(err.message) + '</td></tr>'
        })
    }

    function addUser() {
      const name  = document.getElementById('new-user-name').value.trim()
      const email = document.getElementById('new-user-email').value.trim().toLowerCase()

      if (!name)  { document.getElementById('new-user-name').focus();  return }
      if (!email) { document.getElementById('new-user-email').focus(); return }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showToast('Adresse email invalide.')
        return
      }
      if (email === ADMIN_EMAIL) {
        showToast('Cet email est déjà l\'administratrice.')
        return
      }

      db.collection('authorized_users').doc(email).set({
        name:      name,
        role:      'user',
        addedDate: new Date().toISOString()
      })
      .then(function() {
        document.getElementById('new-user-name').value  = ''
        document.getElementById('new-user-email').value = ''
        loadUsers()
        showToast(name + ' ajouté(e) !')
      })
      .catch(function(err) { showToast('Erreur : ' + err.message) })
    }

    function deleteUser(email) {
      if (!confirm('Supprimer l\'accès de ' + email + ' ?')) return
      db.collection('authorized_users').doc(email).delete()
        .then(function() {
          loadUsers()
          showToast('Utilisateur supprimé.')
        })
        .catch(function(err) { showToast('Erreur : ' + err.message) })
    }

    /* ---- Overview ---- */
    function loadOverview() {
      const today = new Date()

      db.collection('livres').get().then(function(snap) {
        let loans = 0, overdue = 0
        snap.forEach(function(doc) {
          const b = doc.data()
          if (b.lent) {
            loans++
            const days = Math.max(0, Math.floor((today - new Date(b.lent.lentDate)) / 86400000))
            if (days >= (b.lent.reminderDays || 14)) overdue++
          }
        })
        document.getElementById('stat-books').textContent   = snap.size
        document.getElementById('stat-loans').textContent   = loans
        document.getElementById('stat-overdue').textContent = overdue
      }).catch(function() {
        document.getElementById('stat-books').textContent   = '—'
        document.getElementById('stat-loans').textContent   = '—'
        document.getElementById('stat-overdue').textContent = '—'
      })

      db.collection('eleves').get().then(function(snap) {
        document.getElementById('stat-students').textContent = snap.size
      }).catch(function() {
        document.getElementById('stat-students').textContent = '—'
      })
    }

    /* ---- Utilities ---- */
    function escHtml(str) {
      if (str == null) return ''
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }

    function formatDate(iso) {
      if (!iso) return '—'
      try {
        return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' })
      } catch { return '—' }
    }

    let toastTimer = null
    function showToast(msg) {
      const el = document.getElementById('toast')
      el.textContent = msg
      el.hidden = false
      el.style.animation = 'none'
      void el.offsetHeight
      el.style.animation = ''
      clearTimeout(toastTimer)
      toastTimer = setTimeout(function() { el.hidden = true }, 3100)
    }
  </script>
</body>
</html>
